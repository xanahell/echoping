name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/echoping | Out-Null
          Copy-Item target/release/echoping.exe dist/echoping/
          Copy-Item target/release/*.dll dist/echoping/ -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE dist/echoping/
          Compress-Archive -Path dist/echoping -DestinationPath echoping-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: echoping-windows
          path: echoping-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: echoping-windows.zip
