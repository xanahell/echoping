[package]
name = "echoping"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Telegram-клиент для терминала на TDLib и ratatui"
readme = "README.md"
license = "MIT"

[features]
# По умолчанию сборочный скрипт сам скачивает готовую TDLib с GitHub.
default = ["download"]
download = ["tdlib-rs/download-tdlib"]
# Для сборки с уже установленной TDLib (переменная LOCAL_TDLIB_PATH).
local = ["tdlib-rs/local-tdlib"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rodio = "0.20"
tdlib-rs = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
unicode-width = "0.1"

[build-dependencies]
tdlib-rs = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
